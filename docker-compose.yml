services:
  mysql:
    image: mysql:8.0
    container_name: hotel_mosquito_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hotel123
      MYSQL_DATABASE: hotel_mosquito
    ports:
      - "3307:3306"
    volumes:
      - hotel_mosquito_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-photel123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hotel_mosquito_data:
